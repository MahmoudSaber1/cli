name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the supported CLI runtime floor. The matrix installs with
        # --engine-strict so the published engines field is proven, not assumed.
        node: ['22.12.0', 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm test
      - run: npm pack --dry-run

  unsupported-runtime:
    name: Unsupported runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both entries are below the supported floor and must be refused with
        # the exact required version in the failure message.
        node: ['20', '22.11.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies without engine enforcement
        run: npm ci
      - name: Assert the CLI refuses an unsupported runtime with the exact required version
        run: |
          set +e
          output=$(node bin/index.mjs new-app --framework react-vite --yes --no-start --no-install 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error title=Unsupported runtime was not rejected::Node ${{ matrix.node }} is below the supported floor"
            exit 1
          fi
          if ! echo "$output" | grep -q ">=22.12.0"; then
            echo "::error title=Required version missing::the failure message must name the required version"
            exit 1
          fi
      - name: Assert informational commands stay available
        run: node bin/index.mjs --help

  global-install:
    name: Global install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the packed tarball globally
        shell: bash
        run: |
          npm pack
          npm install --global ./create-fsd-architecture-*.tgz
      - name: Both binaries resolve to the same CLI
        shell: bash
        run: |
          expected="$(node -p "require('./package.json').version")"
          test "$(fsd --version)" = "$expected"
          test "$(create-fsd-architecture --version)" = "$expected"
          fsd --help | grep -q "fsd generate"
      - name: fsd creates a project and generates slices
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          fsd create global-app --framework react-vite --package-manager npm --yes --no-install --no-start
          cd global-app
          fsd g entity product
          fsd check
          test -f src/entities/product/index.ts

  upgrade-e2e:
    name: Upgrade E2E / ${{ matrix.framework }} from ${{ matrix.from }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every legacy signature declared in docs/UPGRADE-ARCHITECTURE.md,
          # plus manifest-state projects from 2.6.0 (state 1) and 2.6.3 (state 2).
          - { framework: react-vite, from: 2.3.2 }
          - { framework: nextjs, from: 2.3.2 }
          - { framework: vue-vite, from: 2.3.2 }
          - { framework: nuxt, from: 2.4.0 }
          - { framework: sveltekit, from: 2.5.0 }
          - { framework: react-vite, from: 2.6.0 }
          - { framework: vue-vite, from: 2.6.3 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Historical project -> upgrade -> install -> build
        env:
          CI_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts
        run: node scripts/ci/upgrade-e2e.mjs ${{ matrix.framework }} ${{ matrix.from }}
      - name: Upload upgrade report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-e2e-${{ matrix.framework }}-${{ matrix.from }}
          path: ci-artifacts/upgrade-e2e/
          if-no-files-found: ignore
          retention-days: 14

  package-name-e2e:
    name: Package name E2E / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react-vite, nextjs, vue-vite, nuxt, sveltekit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the project and assert the package identity
        env:
          CI_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts
        run: node scripts/ci/package-name-e2e.mjs ${{ matrix.framework }}
      - name: Upload the package name report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-name-e2e-${{ matrix.framework }}
          path: ci-artifacts/package-name-e2e/
          if-no-files-found: ignore
          retention-days: 14

  cross-os-cli:
    name: Cross-OS CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  cross-os-smoke:
    name: Cross-OS smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI_ARTIFACTS_DIR: ${{ github.workspace }}/ci-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create, generate, inspect, and validate lifecycle contracts
        run: node scripts/ci/os-smoke.mjs
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-os-smoke-${{ matrix.os }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  framework-smoke:
    name: ${{ matrix.framework }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react-vite, nextjs, vue-vite, nuxt, sveltekit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create project
        run: >-
          node bin/index.mjs e2e-app
          --framework ${{ matrix.framework }}
          --package-manager npm
          --yes --no-start
      - name: Generate all slice types and auth
        working-directory: e2e-app
        run: |
          node ../bin/index.mjs --generate feature checkout
          node ../bin/index.mjs --generate entity product
          node ../bin/index.mjs --generate widget cart-summary
          node ../bin/index.mjs --generate page account
          node ../bin/index.mjs --generate feature auth
          node ../bin/index.mjs --generate widget navbar sidebar footer bottom-bar
          node ../bin/index.mjs --generate shared ui
          node ../bin/index.mjs --generate shared api
          node ../bin/index.mjs --generate page about consult
      - name: Validate generated project
        working-directory: e2e-app
        run: npm run ci

  package-manager-smoke:
    name: React / ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22.12.0 ships npm 10.9.0, the documented npm minimum, so this
          # job proves the lowest supported npm against a generated project.
          node-version: '22.12.0'
      - uses: pnpm/action-setup@v6
        if: matrix.package-manager == 'pnpm'
        with:
          # 10.26.0 is the documented pnpm minimum.
          version: '10.26.0'
      - uses: oven-sh/setup-bun@v2
        if: matrix.package-manager == 'bun'
        with:
          # 1.2.0 is the documented bun minimum.
          bun-version: '1.2.0'
      - name: Install Yarn 4
        if: matrix.package-manager == 'yarn'
        run: |
          # 4.18.0 is the documented yarn minimum.
          npm install --global @yarnpkg/cli-dist@4.18.0
          yarn --version
      - run: npm ci
      - name: Create and install project
        run: >-
          node bin/index.mjs e2e-app
          --framework react-vite
          --package-manager ${{ matrix.package-manager }}
          --yes --no-start
      - name: Build with selected package manager
        working-directory: e2e-app
        shell: bash
        run: |
          build_project() {
            case "${{ matrix.package-manager }}" in
              npm) npm run build ;;
              pnpm) pnpm build ;;
              yarn) yarn build ;;
              bun) bun run build ;;
            esac
          }

          set +e
          build_project 2>&1 | tee build-output.log
          build_exit_code=${PIPESTATUS[0]}
          set -e

          if [ "$build_exit_code" -ne 0 ]; then
            BUILD_LOG_PATH="$PWD/build-output.log" python3 - <<'PY'
          import os
          from pathlib import Path

          output = Path(os.environ["BUILD_LOG_PATH"]).read_text(errors="replace")[-12000:]
          escaped = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Package-manager build failed::{escaped}")
          PY
          fi

          exit "$build_exit_code"

  pnpm-build-policy:
    name: pnpm ${{ matrix.pnpm }} / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pnpm: ['10.26.0', '11']
        framework: [react-vite, nuxt]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}
      - run: npm ci
      - name: Create with explicit build approvals
        run: >-
          node bin/index.mjs e2e-app
          --framework ${{ matrix.framework }}
          --package-manager pnpm --yes --no-start
      - name: Generate and validate
        working-directory: e2e-app
        run: |
          node ../bin/index.mjs -g feature checkout
          pnpm run ci
